<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flavour spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="beach.css?v=2026-09-29a">
<style>
  html {
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  h1 {
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1.05;
    margin: 0;
  }
  .status {
    font-style: italic;
    color: var(--muted);
    margin: 1.6rem 0 0;
  }
  .lede {
    font-size: 1.3rem;
    line-height: 1.5;
    text-align: left;
    max-width: 30rem;
    margin: 0 auto;
  }
  .part > h3 {
    font-weight: 500;
    font-size: 1.35rem;
    line-height: 1.25;
    margin: 1.8rem 0 0.4rem;
  }
  .part-intro {
    font-style: italic;
  }
  .points li {
    margin-bottom: 0.75rem;
  }
  .points strong,
  .point strong,
  .provenance strong {
    font-weight: 600;
  }

  /* The ladder: seven rungs down a line, the first one lit. */
  .ladder {
    list-style: none;
    padding: 0;
    margin: 1.3rem 0 0;
  }
  .rung {
    position: relative;
    padding: 0 0 1.4rem 3.1rem;
    margin: 0;
  }
  .rung::before {
    content: none;
  }
  .rung::after {
    content: "";
    position: absolute;
    left: 1.05rem;
    top: 2.3rem;
    bottom: 0.15rem;
    border-left: 1.5px solid var(--frame);
  }
  .rung:last-child {
    padding-bottom: 0;
  }
  .rung:last-child::after {
    content: none;
  }
  .rung-num {
    position: absolute;
    left: 0;
    top: 0;
    width: 2.15rem;
    height: 2.15rem;
    border-radius: 50%;
    border: 1.5px solid var(--crimson);
    background: var(--page);
    color: var(--crimson);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: lining-nums;
  }
  .rung.here .rung-num {
    background: var(--crimson);
    color: var(--page);
  }
  .rung-title {
    font-weight: 600;
    font-size: 1.3rem;
    line-height: 1.25;
    margin: 0.3rem 0 0.25rem;
  }
  .rung-body {
    margin: 0 0 0.4rem;
  }
  .rung.later {
    color: var(--muted);
  }
  .rung.later .rung-num {
    border-color: var(--frame);
    color: var(--muted);
    font-weight: 500;
  }
  .rung.later .rung-title {
    font-weight: 500;
    font-size: 1.2rem;
  }
  .rung.later .rung-body {
    font-size: 1.05rem;
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.5;
    border: 1px solid;
    border-radius: 2px;
    padding: 0.05rem 0.5rem;
    margin: 0.35rem 0 0;
  }
  .tag-here {
    color: var(--page);
    background: var(--crimson);
    border-color: var(--crimson);
  }
  .tag-later {
    color: var(--muted);
    border-color: var(--frame);
  }
  .respond-now {
    display: inline-block;
    font-size: 1.1rem;
    letter-spacing: 0.06em;
    color: var(--page);
    background: var(--crimson);
    border: 0;
    border-radius: 2px;
    padding: 0.55rem 1.3rem;
    margin: 0.2rem 0 0;
  }
  .respond-now:hover {
    border-bottom: 0;
    opacity: 0.9;
  }
  .respond-now:focus-visible {
    outline: 2px solid var(--crimson);
    outline-offset: 2px;
  }

  /* What has just moved on the beach. */
  .live-strip {
    border-top: 1px solid var(--frame);
    border-bottom: 1px solid var(--frame);
    background: var(--paper);
    margin: 0.4rem 0 1.1rem;
    padding: 0.5rem 0.8rem;
  }
  .live-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .live-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.8rem;
    font-size: 1rem;
    line-height: 1.35;
    padding: 0.3rem 0 0.3rem 1.1rem;
    margin: 0;
  }
  .live-item + .live-item {
    border-top: 1px dotted var(--frame);
  }
  .live-item::before {
    top: 0.85em;
    left: 0.1rem;
    width: 0.42rem;
    height: 0.42rem;
    background: var(--frame);
  }
  .live-item:first-child::before {
    background: var(--crimson);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse {
    50% { opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-item:first-child::before { animation: none; }
  }
  .live-name {
    font-weight: 600;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .live-ago {
    flex: none;
    font-style: italic;
    color: var(--muted);
    font-size: 0.95rem;
    white-space: nowrap;
  }

  /* The experiment: one figure, then the trail down a line. */
  .spark-figure {
    text-align: center;
    margin: 1.6rem 0 0.4rem;
  }
  .spark-num {
    display: block;
    font-size: 5.6rem;
    font-weight: 500;
    line-height: 0.95;
    color: var(--crimson);
    font-variant-numeric: lining-nums;
  }
  .spark-unit {
    display: block;
    font-size: 1rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0.3rem 0 0;
  }
  .spark-line {
    font-style: italic;
    margin: 0.2rem 0 0;
  }
  .trail {
    list-style: none;
    padding: 0;
    margin: 0.9rem 0 0;
  }
  .moment {
    display: grid;
    grid-template-columns: 3.3rem 1fr;
    gap: 0 0.85rem;
    padding: 0;
    margin: 0;
  }
  .moment::before {
    content: none;
  }
  .moment-time {
    text-align: right;
    font-weight: 600;
    color: var(--crimson);
    font-variant-numeric: lining-nums tabular-nums;
    white-space: nowrap;
  }
  .moment-text {
    position: relative;
    border-left: 1.5px solid var(--frame);
    padding: 0 0 1rem 0.95rem;
    overflow-wrap: break-word;
    min-width: 0;
  }
  .moment-text::before {
    content: "";
    position: absolute;
    left: -0.3rem;
    top: 0.55em;
    width: 0.52rem;
    height: 0.52rem;
    border-radius: 50%;
    background: var(--crimson);
  }
  .moment:last-child .moment-text {
    padding-bottom: 0;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
    gap: 0.7rem;
    list-style: none;
    padding: 0;
    margin: 0.8rem 0 0;
  }
  .card {
    border: 1px solid var(--frame);
    background: var(--paper);
    padding: 0.8rem 0.95rem 0.85rem;
    margin: 0;
  }
  .card::before {
    content: none;
  }
  .card-title {
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.2;
    color: var(--crimson);
    margin: 0 0 0.3rem;
  }
  .card-body {
    font-size: 1.05rem;
    line-height: 1.45;
    margin: 0;
  }
  .point {
    border-left: 3px solid var(--crimson);
    background: var(--paper);
    font-size: 1.25rem;
    line-height: 1.45;
    padding: 0.9rem 1rem;
    margin: 1.6rem 0 0;
  }

  #respond {
    scroll-margin-top: 1rem;
  }
  #thread {
    margin: 1.6rem 0 0;
  }
  .provenance {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--muted);
    overflow-wrap: break-word;
    margin: 0;
  }
  @media (min-width: 560px) {
    h1 { font-size: 3rem; }
  }
</style>
</head>
<body>
<main>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html">Phenomemental</a>
    <a href="wholeless-nights.html">Wholeless Nights</a>
    <a href="night-watchman.html">The Night Watchman</a>
    <a href="map.html">My map</a>
  </nav>

  <div class="sheet">
    <!-- Every word below is read live from the beach (spine:flavour-spark);
         nothing of the page itself is kept here. -->
    <p class="status" id="status" role="status">Reading the latest version from the beach&hellip;</p>

    <div id="doc" hidden>
      <h1 id="title"></h1>
      <hr class="rule">
      <p class="lede" id="lede"></p>
      <div id="parts"></div>
    </div>

    <hr class="rule" id="respond-rule" hidden>

    <section id="respond" hidden>
      <h2>Respond</h2>

      <form id="note-form">
        <label for="n-name">Your name (shown as &ldquo;your name, a visitor&rdquo;)</label>
        <input id="n-name" name="who" maxlength="40" autocomplete="name">
        <label class="trap" for="n-web" aria-hidden="true">Leave this empty</label>
        <input class="trap" id="n-web" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label for="n-text">Your note</label>
        <textarea id="n-text" name="note" maxlength="2000" required></textarea>
        <button type="submit">Leave a note</button>
        <p class="form-status" role="status"></p>
        <p class="form-foot">Notes are public, and appear below for everyone who reads this page.</p>
      </form>

      <div class="thread" id="thread" aria-live="polite"></div>
    </section>

    <div id="provenance-box" hidden>
      <hr class="rule">
      <section>
        <p class="provenance" id="provenance"></p>
      </section>
    </div>

    <p class="live-note" id="live-note"></p>
  </div>

  <footer class="site-footer">
    <p>The beach this page lives on was built by David Pinto (happyseaurchin).</p>
  </footer>
</main>
<script src="beach.js?v=2026-10-10a"></script>
<script>
(function () {
  var text = Beach.text;
  var SPINE = 'spine:flavour-spark';
  var ROOM = 'pool:flavour-spark';
  // Blocks left out of the live strip.
  var UNSHOWN = /^(grain|vault|ledger|history):/;
  var OFFLINE = 'This page reads its words live from the beach, and the beach can’t be reached just now. Please try again in a few minutes.';

  var partsBox = document.getElementById('parts');
  var status = document.getElementById('status');
  var form = document.getElementById('note-form');
  var thread = document.getElementById('thread');
  var loaded = false;
  var lastSig = null;
  var stripSig = null;

  function el(tag, cls, s) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (s != null) e.textContent = s;
    return e;
  }

  // The live strip is kept from one drawing to the next, and put back in
  // its place after position 3.5 each time the block is drawn.
  var strip = el('div', 'live-strip');
  strip.setAttribute('aria-live', 'polite');
  strip.hidden = true;

  // A node's own words: a string, or its "_". When the beach has nested
  // older entries under "_", the words are further down it.
  function own(node) {
    while (node && typeof node === 'object' && node._ && typeof node._ === 'object') node = node._;
    return text(node).trim();
  }

  // Every line is "Label. Body": the label is everything before the first
  // full stop followed by a space, the body the rest.
  function split(s) {
    var i = s.indexOf('. ');
    if (i < 0) return { label: s.replace(/\.$/, ''), body: '' };
    return { label: s.slice(0, i), body: s.slice(i + 2).trim() };
  }

  // A node's children 1 to 9 that have words.
  function children(node) {
    var out = [];
    if (!node || typeof node !== 'object') return out;
    for (var i = 1; i <= 9; i++) {
      var t = own(node[String(i)]);
      if (t) out.push({ pos: i, text: t });
    }
    return out;
  }

  // An accumulating node, oldest first: "_" first when the beach has
  // nested older entries there, then 1 to 9.
  function walk(node, out) {
    out = out || [];
    if (!node || typeof node !== 'object') return out;
    if (node._ && typeof node._ === 'object') walk(node._, out);
    for (var i = 1; i <= 9; i++) {
      var t = own(node[String(i)]);
      if (t) out.push(t);
    }
    return out;
  }

  // A heading from the label, the body beneath it.
  function heading(parent, s, tag) {
    var p = split(s);
    parent.appendChild(el(tag || 'h2', null, p.label));
    if (p.body) parent.appendChild(el('p', 'part-intro', p.body));
  }

  // The label as a bold lead-in, the body after it.
  function leadIn(parent, s) {
    var p = split(s);
    parent.appendChild(el('strong', null, p.label + (p.body ? '.' : '')));
    if (p.body) parent.appendChild(document.createTextNode(' ' + p.body));
    return parent;
  }

  function part(node) {
    var t = own(node);
    var sec = el('section', 'part');
    if (t) heading(sec, t);
    return sec;
  }

  // Position 1: the ladder.
  function ladder(node) {
    var rungs = children(node).filter(function (c) { return c.pos <= 7; });
    if (!own(node) && !rungs.length) return null;
    var sec = part(node);
    var ol = el('ol', 'ladder');
    rungs.forEach(function (c) {
      var p = split(c.text);
      var li = el('li', 'rung' + (c.pos === 1 ? ' here' : c.pos >= 3 ? ' later' : ''));
      var num = el('span', 'rung-num', String(c.pos));
      num.setAttribute('aria-hidden', 'true');
      li.appendChild(num);
      if (c.pos === 1) li.appendChild(el('span', 'tag tag-here', 'You are here'));
      if (c.pos >= 3) li.appendChild(el('span', 'tag tag-later', 'Not built yet'));
      li.appendChild(el('h3', 'rung-title', p.label));
      if (p.body) li.appendChild(el('p', 'rung-body', p.body));
      if (c.pos === 2) {
        var a = el('a', 'respond-now', 'Respond now');
        a.href = '#respond';
        li.appendChild(a);
      }
      ol.appendChild(li);
    });
    sec.appendChild(ol);
    return sec;
  }

  // A section whose children are a list; the live strip goes straight
  // after the child at stripAfter, when there is one.
  function list(node, stripAfter) {
    var items = children(node);
    if (!own(node) && !items.length) return null;
    var sec = part(node);
    var ul = el('ul', 'points');
    items.forEach(function (c) {
      ul.appendChild(leadIn(el('li'), c.text));
      if (c.pos === stripAfter) {
        sec.appendChild(ul);
        sec.appendChild(strip);
        ul = el('ul', 'points');
      }
    });
    if (ul.childNodes.length) sec.appendChild(ul);
    return sec;
  }

  // Minutes from the first trail time (HH:MM) to the last.
  function span(moments) {
    var times = [];
    moments.forEach(function (m) {
      var t = split(m).label.match(/^(\d{1,2}):(\d{2})$/);
      if (t) times.push(Number(t[1]) * 60 + Number(t[2]));
    });
    if (times.length < 2) return null;
    var d = times[times.length - 1] - times[0];
    return d < 0 ? d + 1440 : d;
  }

  // Position 4: the experiment.
  function experiment(node) {
    if (!own(node) && !(node && typeof node === 'object')) return null;
    var sec = part(node);
    if (!node || typeof node !== 'object') return sec;

    var trailNode = node['1'];
    var moments = walk(trailNode);
    var mins = span(moments);
    if (mins != null) {
      var fig = el('div', 'spark-figure');
      fig.appendChild(el('span', 'spark-num', String(mins)));
      fig.appendChild(el('span', 'spark-unit', mins === 1 ? 'minute' : 'minutes'));
      fig.appendChild(el('p', 'spark-line', 'from the voice note to the last line below'));
      sec.appendChild(fig);
    }
    var tt = own(trailNode);
    if (tt) heading(sec, tt, 'h3');
    if (moments.length) {
      var ol = el('ol', 'trail');
      moments.forEach(function (m) {
        var p = split(m);
        var li = el('li', 'moment');
        li.appendChild(el('span', 'moment-time', p.label));
        li.appendChild(el('span', 'moment-text', p.body));
        ol.appendChild(li);
      });
      sec.appendChild(ol);
    }

    var whoNode = node['2'];
    var wt = own(whoNode);
    if (wt) heading(sec, wt, 'h3');
    var cards = children(whoNode);
    if (cards.length) {
      var ul = el('ul', 'cards');
      cards.forEach(function (c) {
        var p = split(c.text);
        var li = el('li', 'card');
        li.appendChild(el('p', 'card-title', p.label));
        if (p.body) li.appendChild(el('p', 'card-body', p.body));
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    }

    var pt = own(node['3']);
    if (pt) sec.appendChild(leadIn(el('p', 'point'), pt));
    return sec;
  }

  function renderProvenance(s) {
    var p = document.getElementById('provenance');
    p.textContent = '';
    if (s) leadIn(p, s);
    document.getElementById('provenance-box').hidden = !s;
  }

  // Draw the page; false if there is nothing to show. Drawn again only
  // when the block itself has changed.
  function render(spine) {
    if (!spine || typeof spine !== 'object') return false;
    var root = own(spine);
    if (!root) return false;
    var sig = JSON.stringify(spine);
    if (sig === lastSig) return true;
    lastSig = sig;

    var r = split(root);
    document.getElementById('title').textContent = r.label;
    document.title = r.label;
    var lede = document.getElementById('lede');
    lede.textContent = r.body;
    lede.hidden = !r.body;

    var frag = document.createDocumentFragment();
    [ladder(spine['1']), list(spine['2']), list(spine['3'], 5), experiment(spine['4']), list(spine['5'])]
      .forEach(function (sec) {
        if (!sec) return;
        frag.appendChild(el('hr', 'rule'));
        frag.appendChild(sec);
      });
    partsBox.textContent = '';
    partsBox.appendChild(frag);
    renderProvenance(own(spine['9']));
    return true;
  }

  // ---- The live strip ----------------------------------------------------
  function plural(n, one) {
    return n + ' ' + one + (n === 1 ? '' : 's') + ' ago';
  }

  function ago(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 60) return plural(Math.max(m, 0), 'minute');
    var h = Math.floor(m / 60);
    if (h < 24) return plural(h, 'hour');
    return plural(Math.floor(h / 24), 'day');
  }

  // The eight blocks touched most recently, newest first. Nothing shows
  // if the index can't be read.
  function renderStrip(idx) {
    var blocks = idx && Array.isArray(idx.blocks) ? idx.blocks : [];
    var touched = idx && idx.touched && typeof idx.touched === 'object' ? idx.touched : {};
    var now = Date.now();
    var c = Beach.clock();
    if (c && !isNaN(Date.parse(c.iso))) now = Date.parse(c.iso);
    var latest = blocks.filter(function (b) {
      return typeof b === 'string' && !UNSHOWN.test(b) && !isNaN(Date.parse(touched[b]));
    }).sort(function (a, b) {
      return Date.parse(touched[b]) - Date.parse(touched[a]);
    }).slice(0, 8).map(function (b) {
      return { name: b, ago: ago(now - Date.parse(touched[b])) };
    });
    var sig = JSON.stringify(latest);
    if (sig === stripSig) return;
    stripSig = sig;
    strip.textContent = '';
    strip.hidden = !latest.length;
    if (!latest.length) return;
    var ol = el('ol', 'live-list');
    latest.forEach(function (x) {
      var li = el('li', 'live-item');
      li.appendChild(el('span', 'live-name', x.name));
      li.appendChild(el('span', 'live-ago', x.ago));
      ol.appendChild(li);
    });
    strip.appendChild(ol);
  }

  // A note someone cleared has no words left. Leave it out, with its name
  // and time, so it doesn't show as a blank note.
  function withoutCleared(node) {
    if (!node || typeof node !== 'object') return node;
    var out = {};
    Object.keys(node).forEach(function (k) {
      var v = node[k];
      if (k !== '_' && v && typeof v === 'object') {
        var said = typeof v._ === 'string' ? v._.trim() : (v._ && typeof v._ === 'object');
        var holds = Object.keys(v).some(function (j) { return j !== '_' && v[j] && typeof v[j] === 'object'; });
        if (!said && !holds) return;
        out[k] = withoutCleared(v);
      } else if (k === '_' && v && typeof v === 'object') {
        out[k] = withoutCleared(v);
      } else {
        out[k] = v;
      }
    });
    return out;
  }

  var refresh = Beach.live(function () {
    return Promise.all([
      Promise.all([
        Beach.get(SPINE),
        Beach.index().catch(function () { return null; })
      ]).then(function (r) {
        if (!render(r[0])) throw new Error('nothing to show');
        renderStrip(r[1]);
      }),
      // The page still shows if the room can't be read.
      Beach.get(ROOM).then(function (pool) {
        Beach.renderThread(thread, withoutCleared(pool));
      }, function () {})
    ]).then(function () {
      loaded = true;
    }, function (e) {
      // Never a blank page: one plain line instead.
      if (!loaded) status.textContent = OFFLINE;
      throw e;
    });
  }, document.getElementById('live-note'), function () {
    status.hidden = true;
    ['doc', 'respond-rule', 'respond'].forEach(function (id) {
      document.getElementById(id).hidden = false;
    });
  }, '');

  // After a note is sent, read the room again so it appears at once.
  Beach.wireNoteForm(form, ROOM, refresh);
})();
</script>
</body>
</html>
