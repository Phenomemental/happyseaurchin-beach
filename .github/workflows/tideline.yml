# Tideline's phone app: on every push to tideline/, check it, build a signed
# APK and put it on the release named tideline-latest (spine:tideline 7.17).
# The signing key lives only in the repository secrets TIDELINE_SIGNING_KEY
# (the PKCS12 file, base64) and TIDELINE_SIGNING_PASSWORD.
name: Tideline

on:
  push:
    paths:
      - 'tideline/**'
      - '.github/workflows/tideline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tideline-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tideline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check the seal, the beach calls and the rules
        run: ./gradlew --no-daemon :seal:test :beach:test :app:testDebugUnitTest

      - name: Unpack the signing key
        env:
          TIDELINE_SIGNING_KEY: ${{ secrets.TIDELINE_SIGNING_KEY }}
          TIDELINE_SIGNING_PASSWORD: ${{ secrets.TIDELINE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$TIDELINE_SIGNING_KEY" ]; then
            echo "::error::The secrets TIDELINE_SIGNING_KEY and TIDELINE_SIGNING_PASSWORD are not set, so no APK can be signed. See tideline/README.md."
            exit 1
          fi
          # A secret pasted from a chat or a document can carry line breaks or
          # spaces; base64 has neither, so they go. The length and the start
          # of a fingerprint say whether the whole key arrived, and give away
          # nothing of it.
          key=$(printf '%s' "$TIDELINE_SIGNING_KEY" | tr -d '[:space:]')
          echo "TIDELINE_SIGNING_KEY: ${#key} characters, fingerprint $(printf '%s' "$key" | sha256sum | cut -c1-12)"
          if ! printf '%s' "$key" | base64 -d > "$RUNNER_TEMP/tideline-signing.p12" 2>/dev/null; then
            echo "::error::TIDELINE_SIGNING_KEY is not the key file as base64. Paste the whole text of tideline-signing.p12.base64.txt into it again."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/tideline-signing.p12" -storetype PKCS12 \
              -storepass:env TIDELINE_SIGNING_PASSWORD -alias tideline > /dev/null 2>&1; then
            echo "::error::The signing key and its password do not open together. Paste the whole of tideline-signing.p12.base64.txt into TIDELINE_SIGNING_KEY (1420 characters) and the password into TIDELINE_SIGNING_PASSWORD again."
            exit 1
          fi
          echo "The signing key opens with its password."

      - name: Build the app
        env:
          TIDELINE_SIGNING_KEY_FILE: ${{ runner.temp }}/tideline-signing.p12
          TIDELINE_SIGNING_PASSWORD: ${{ secrets.TIDELINE_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Put it on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tideline.apk"
          gh release delete tideline-latest --cleanup-tag --yes || true
          gh release create tideline-latest "$RUNNER_TEMP/tideline.apk" \
            --target "$GITHUB_SHA" \
            --title "Tideline, latest build" \
            --notes "Built from $GITHUB_REF_NAME at ${GITHUB_SHA::7}. How to install it: tideline/README.md."

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tideline-signing.p12"
