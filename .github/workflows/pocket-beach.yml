# Pocket beach — the Android app in pocket-beach/.
#
# Runs on a change under pocket-beach/ (or to this file). A release is started
# with "Run workflow" on main, giving the version (0.1): the release job then
# makes the tag pocket-beach-v0.1 at the commit it built, and publishes the
# signed APK as the GitHub Release of that name. Pushing such a tag by hand
# starts the same release.
#
#   test      the conformance checks: the golden calls regenerated from the
#             original bsp-mcp-server and pscale-beach at the pinned commits
#             and compared with the committed ones, the teaching shelf
#             compared with upstream, then the Kotlin replay of the committed
#             corpus and of 1,000 freshly generated random cases, and the
#             smoke, pocket and JavaScript-rule tests. Any mismatch fails.
#   core-windows  the core (the bsp module, plain Kotlin with no Android in
#             it) built and tested on Windows with the Android app left out:
#             the golden replay in files and in memory, and every other core
#             test.
#   emulator  installs the app on a Pixel-class emulator, opens it, and runs
#             the on-device tests (the whetstone from the shelf, a write read
#             back from its own file, the test screen, the golden replay).
#   release   a started release or a version tag only: the signed APK,
#             attached to the Release.

name: pocket-beach

on:
  push:
    branches: ['**']
    tags: ['pocket-beach-v*']
    paths:
      - 'pocket-beach/**'
      - '.github/workflows/pocket-beach.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, as the app names it: 0.1 makes pocket-beach-v0.1. Run on main.'
        required: true
        type: string

# A newer push replaces a branch's run; a release is never cancelled.
concurrency:
  group: pocket-beach-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: pocket-beach

env:
  ANDROID_PLATFORM: 'platforms;android-37.0'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null

      - name: Regenerate the golden calls from the original code
        run: conformance/generate.sh "$RUNNER_TEMP/golden.json"
      - name: The committed golden calls are current
        run: |
          if ! cmp -s conformance/golden/golden.json "$RUNNER_TEMP/golden.json"; then
            echo "::error::conformance/golden/golden.json differs from what the pinned upstream produces — run conformance/generate.sh and commit the result"
            exit 1
          fi
      - name: Generate 1,000 more random cases
        run: conformance/generate.sh "$RUNNER_TEMP/random.json" 1000 7

      - name: Kotlin tests against the committed corpus
        run: ./gradlew :bsp:test
      - name: Kotlin replay of the random cases
        run: ./gradlew :bsp:test --tests '*GoldenTest' -Pgolden="$RUNNER_TEMP/random.json" --rerun-tasks
      - name: Build the app
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: pocket-beach/bsp/build/reports/tests/

  core-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: The core's tests on Windows, without the Android app
        run: ./gradlew.bat :bsp:test -PcoreOnly
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-test-reports
          path: pocket-beach/bsp/build/reports/tests/

  emulator:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null
      - name: Build the app and its on-device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Install, open and test on a Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: pocket-beach
          # After the tests (which uninstall the app), the screen tour runs once
          # more on its own so its pictures can be copied off the emulator.
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.phenomemental.pocketbeach/.MainActivity
            ./gradlew :app:connectedDebugAndroidTest
            ./gradlew :app:installDebug :app:installDebugAndroidTest
            adb shell am instrument -w -e class com.phenomemental.pocketbeach.ScreenTour com.phenomemental.pocketbeach.test/androidx.test.runner.AndroidJUnitRunner
            adb exec-out run-as com.phenomemental.pocketbeach tar -cf - -C files screens > app/build/screens.tar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: pocket-beach/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: pocket-beach/app/build/screens.tar

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/pocket-beach-v')
    needs: [test, core-windows, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      POCKET_KEYSTORE_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
      POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
      POCKET_KEY_ALIAS: ${{ secrets.POCKET_KEY_ALIAS }}
      POCKET_KEY_PASSWORD: ${{ secrets.POCKET_KEY_PASSWORD }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Which release
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::A release is started from main, not from $GITHUB_REF_NAME"
              exit 1
            fi
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The version must look like 0.1, not \"$VERSION\""
              exit 1
            fi
            tag="pocket-beach-v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag already exists. Every release needs a new version"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null
      - name: The signing secrets are set
        run: |
          for v in POCKET_KEYSTORE_B64 POCKET_KEYSTORE_PASSWORD POCKET_KEY_ALIAS POCKET_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::The repository secret $v is not set. Every release is signed with the one key — see pocket-beach/STATUS.md."
              exit 1
            fi
          done
      - name: Build the signed release
        run: |
          echo "$POCKET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pocket.keystore"
          POCKET_KEYSTORE_FILE="$RUNNER_TEMP/pocket.keystore" ./gradlew :app:assembleRelease
          rm -f "$RUNNER_TEMP/pocket.keystore"
      - name: Check the signature and the version
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --print-certs "$apk"
          name=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "pocket-beach-v$name" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match the app's versionName $name"
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/$TAG.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A started release makes its tag here, at the commit just built.
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Pocket beach ${TAG#pocket-beach-v}. Install $TAG.apk on the phone — see pocket-beach/STATUS.md for what to try."
