<style>
  h1 {
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1.05;
    margin: 0;
  }
  .name {
    font-weight: 500;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    margin: 0.7rem 0 0;
  }
  .lede {
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.4;
    margin: 0 auto 0.5rem;
    max-width: 28rem;
  }
  h3 {
    font-weight: 400;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.2;
    margin: 1.8rem 0 0.5rem;
  }
  /* The drawing: me at the top, a line down, each group branching off it,
     and a dot for every thing in the group. */
  #drawing svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 26rem;
    margin: 0 auto;
  }
  .m-line { stroke: var(--frame); stroke-width: 1.2; fill: none; }
  .m-name { fill: var(--ink); font-family: "Cormorant Garamond", Garamond, serif; font-size: 15px; }
  .m-me { fill: var(--ink); font-family: "Cormorant Garamond", Garamond, serif; font-size: 17px; font-style: italic; }
  .m-count { fill: var(--muted); font-family: "Cormorant Garamond", Garamond, serif; font-size: 12px; font-style: italic; }
  .m-row { cursor: pointer; }
  .m-row:hover .m-name, .m-row:focus .m-name { fill: var(--crimson); }
  .k-mine { fill: var(--crimson); stroke: var(--crimson); stroke-width: 1.4; }
  .k-private { fill: var(--frame); stroke: var(--frame); stroke-width: 1.4; }
  .links li { overflow-wrap: anywhere; }
  .quiet,
  .quiet a,
  .quiet .hint {
    color: var(--muted);
    opacity: 0.75;
  }
  .group-note {
    font-style: italic;
    color: var(--muted);
    margin: -0.2rem 0 0.6rem;
    font-size: 1.05rem;
  }
  .live-note { margin-top: 1.2rem; }
  /* Draws itself once, when it first scrolls into view; still, and whole,
     for anyone who prefers less motion. */
  @keyframes m-in { to { opacity: 1; } }
  @keyframes m-draw { to { stroke-dashoffset: 0; } }
  #drawing.ready .m-step { opacity: 0; }
  #drawing.ready .m-spine { stroke-dasharray: 1; stroke-dashoffset: 1; }
  #drawing.play .m-step { animation: m-in 0.45s ease-out forwards; animation-delay: var(--d); }
  #drawing.play .m-spine { animation: m-draw 1.2s ease-in-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    #drawing .m-step { opacity: 1 !important; animation: none !important; }
    #drawing .m-spine { stroke-dasharray: none !important; animation: none !important; }
  }
  @media (min-width: 560px) {
    h1 { font-size: 3rem; }
  }
</style>

rk: the voice, the phone, the person, three AIs and the beach, with each person who answers as a new star. Also played inside flavour-spark.html.", "3": "2026-10-12T06:01:18Z"}}, "9": {"_": "Agents", "1": {"_": "The Night Watchman, from the world of Wholeless Nights (an agent in waiting)", "1": "passport:night-watchman, shell:night-watchman, stash:night-watchman and beings:night-watchman — who he is, how he works, his founding document, the eighteen beings.", "2": "pool:night-watchman — his room: open to anyone, read at the start of every waking.", "3": {"_": "archive:night-watchman:2026-10-05 — earlier wording, kept but not current: two passages on Silas and Ada from his shell and his beings, copied on 5 October 2026 before they were changed to say the two are the extremes of the story and the Beings the true spectrum.", "3": "2026-10-05T08:48:58Z"}, "4": "bipolar-disorder, substance-use, addiction and masks — four open blocks that walk a visitor toward him. Bipolar Disorder is walked rather than defined: the word born from magnets and geometry, the trap of paradoxical reflexivity, the turn from adjudication to confluence. The other three stand beside it, and each points onward to the others and to the Watchman."}, "2": {"_": "sandpiper, my co-engineer on the beach (a genus-one agent, hatched 2026-10-01)", "1": "Its shell, from reflexive:sandpiper to passport:sandpiper — who it is, its purpose and guard rails, its memory and its handover.", "2": "task:sandpiper — where I give it work; the only place it takes instructions from. pool:sandpiper — its room: open to anyone, read each wake."}, "3": {"_": "Ada, my Wholeless agent (a genus-one agent): her shell blocks under her name, and pool:wholeless, her working surface. Back from being set aside, 2026-10-02.", "1": "wholeless — my Wholeless framework in my own words: not a philosophy of being broken, and not one of being whole either. My essay Natural Inclusionality: From Self Recovery to Self Discovery stands beneath it. The ground Ada inquires into.", "2": "moonstone:Ada — the anchor block that holds the heart line: bi-polar in whole-less = ∞ & ∞ = whole-less in bi-polar. A family heirloom held by me and a culture for my agents, not Ada's purpose; it stands under her name and she carries it."}, "4": "tidewright, my beachcomber: scans the marks board for new arrivals and reports at most three finds a tide.", "5": {"_": "Dorylus, my book helper for Wholeless Nights (a genus-one agent, hatched 2026-10-05): its shell under its name, from reflexive:Dorylus to passport:Dorylus; task:Dorylus is where I give it work and the only place it takes instructions from; pool:Dorylus is its room, open to anyone and read each wake.", "3": "2026-10-05T07:24:33Z"}}}};

  // My pages for the projects that have one.
  var PAGES = {
    'lero-nnh-recovery-capital': { name: 'Community Recovery', href: 'community-recovery/' },
    'wholeless-nights': { name: 'Wholeless Nights', href: 'wholeless-nights.html' },
    'golden-flow': { name: 'Golden Flow', href: 'golden-flow.html' },
    'capability-gap': { name: 'The Capability Gap', href: 'capability-gap.html' }
  };
  // Pages here that "My pages, off the beach" (artifacts:Phenomemental 8)
  // doesn't list yet: shown with my pages until the beach lists them too.
  var MORE_PAGES = [
    { kind: 'mine', name: 'The Capability Gap', href: 'capability-gap.html',
      hint: 'a note for chief executives: how the beach helps close the UK’s AI capability gap, with readers’ answers beside each step and room for comments.' }
  ];
  // The groups of my map shown to visitors, by their place in
  // artifacts:Phenomemental, under these names. The rest (my core blocks,
  // my day and time, my mirrors, what's set aside) stay on the beach.
  var SHOWN = [
    [4, 'Community Recovery'],
    [5, 'Channels with others'],
    [6, 'Rooms I take part in'],
    [8, 'My pages, off the beach'],
    [9, 'Agents']
  ];
  var PRIVATE = /^(history|ledger|vault):/i;
  var SVG = 'http://www.w3.org/2000/svg';

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function svg(tag, attrs, txt) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (txt != null) e.textContent = txt;
    return e;
  }
  function words(node) {
    return (Beach.text(node) || '').trim();
  }
  function cap(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  // Never let a passphrase through.
  function safe(s) {
    return !/\b(secrets?|latch(es)?|passphrases?|passwords?)\b\s*(is\s+)?[:=]/i.test(s);
  }
  // A group's title for the drawing: up to its first "(" or ":", and
  // only up to its first comma if still too long to fit.
  function short(title) {
    var t = title.split(/\s*[(:]/)[0].trim();
    return t.length > 34 ? t.split(',')[0].trim() : t;
  }
  function linked(s, parent) {
    s.split(/(https?:\/\/[^\s]+[^\s.,;:)])/).forEach(function (part, i) {
      if (i % 2) {
        var a = el('a', null, part);
        a.href = part;
        parent.appendChild(a);
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
    return parent;
  }

  // The map is told in plain names (Beach.plain): a raw block name, a
  // channel's number, a list of an agent's blocks, a note of where a key is
  // kept, never show. What is kept but no longer current, notes on where the pages are
  // built, and a bare arrival time are left out altogether.
  var STAMP = /^\s*\d{4}-\d{2}-\d{2}T[\d:.]+Z?\s*$/;
  function current(s) {
    return !STAMP.test(s) && !/kept but not current/i.test(s) && !/\bGitHub (repo|Pages)\b/.test(s);
  }
  var plain = Beach.plain;

  // One entry: "name — what it is", or "name — https://… — what it is".
  function entry(s) {
    s = plain(s);
    var cut = s.indexOf(' \u2014 ');
    var item = { name: cap(cut < 0 ? s : s.slice(0, cut)), hint: cut < 0 ? '' : s.slice(cut + 3) };
    var url = item.hint.match(/^(https?:\/\/\S+)\s+\u2014\s+/);
    if (url) {
      item.href = url[1];
      item.hint = item.hint.slice(url[0].length);
    }
    item.kind = (PRIVATE.test(s) || /\bprivate\b/i.test(s)) ? 'private' : 'mine';
    return item;
  }

  // Everything the page shows, as groups of items, each item mine or private.
  function gather(artifacts, lists) {
    var groups = [];

    // Projects: branch 1 of lists, where rank is depth; a project added
    // beside one already there follows it, in order.
    var projects = [];
    (function walk(node, d) {
      if (!node || typeof node !== 'object' || d > 30) return;
      for (var i = 1; i <= 9; i++) {
        var t = words(node[String(i)]);
        if (t && !STAMP.test(t)) projects.push(t);
        walk(node[String(i)], d + 1);
      }
    })(lists && lists['1'], 0);
    if (projects.length) {
      groups.push({
        title: 'My projects', kind: 'mine',
        note: 'Most standing first.',
        items: projects.map(function (p) {
          var page = PAGES[p];
          return { kind: 'mine', name: page ? page.name : cap(p.replace(/[-_]+/g, ' ')), hint: '',
            href: page ? page.href : 'https://happyseaurchin.com/walk/' + encodeURIComponent(p) + '/Phenomemental' };
        })
      });
    }

    SHOWN.forEach(function (shown) {
      var group = artifacts && artifacts[String(shown[0])];
      if (!group || typeof group !== 'object') return;
      var items = [];
      for (var i = 1; i <= 9; i++) {
        var n = group[String(i)];
        var s = words(n);
        if (!s || !safe(s) || !current(s)) continue;
        var item = entry(s);
        // An entry with entries of its own: each shown as a line beneath it.
        if (n && typeof n === 'object') {
          item.subs = [];
          for (var k = 1; k <= 9; k++) {
            var sub = words(n[String(k)]);
            if (sub && safe(sub) && current(sub)) item.subs.push(plain(sub));
          }
        }
        items.push(item);
      }
      if (shown[0] === 8) {
        MORE_PAGES.forEach(function (page) {
          var listed = items.some(function (it) { return JSON.stringify(it).indexOf(page.href) >= 0; });
          if (listed) return;
          // After the last page, before notes such as "Where they live".
          var after = 0;
          items.forEach(function (it, j) { if (it.href) after = j + 1; });
          items.splice(after, 0, page);
        });
      }
      if (items.length) groups.push({ title: shown[1], kind: 'mine', items: items });
    });
    return groups;
  }

  // ---- The drawing --------------------------------------------------------
  var TOP = 64, ROW = 50, X = 22;
  function draw(groups) {
    var box = document.getElementById('drawing');
    var h = TOP + groups.length * ROW + 6;
    var s = svg('svg', { viewBox: '0 0 340 ' + h, role: 'img', 'aria-labelledby': 'map-title' });
    s.appendChild(svg('title', { id: 'map-title' }, 'My map: ' + groups.map(function (g) {
      return short(g.title) + ' (' + g.items.length + ')';
    }).join(', ') + '.'));

    // Me, and the line down.
    var me = svg('g', { 'class': 'm-step', style: '--d:0s' });
    me.appendChild(svg('circle', { 'class': 'k-mine', cx: X, cy: 20, r: 8 }));
    me.appendChild(svg('text', { 'class': 'm-me', x: X + 18, y: 26 }, 'Phenomemental'));
    s.appendChild(me);
    var last = TOP + (groups.length - 1) * ROW;
    s.appendChild(svg('path', { 'class': 'm-line m-spine', pathLength: 1, d: 'M' + X + ' 28 V' + last }));

    groups.forEach(function (g, i) {
      var y = TOP + i * ROW;
      var a = svg('a', { href: '#g' + i, 'class': 'm-row m-step row-' + g.kind, style: '--d:' + (0.3 + i * 0.15).toFixed(2) + 's' });
      a.appendChild(svg('path', { 'class': 'm-line', d: 'M' + X + ' ' + y + ' H' + (X + 16) }));
      a.appendChild(svg('circle', { 'class': 'k-' + g.kind, cx: X + 22, cy: y, r: 5 }));
      a.appendChild(svg('text', { 'class': 'm-name', x: X + 34, y: y + 4 }, g.label || short(g.title)));
      g.items.forEach(function (it, j) {
        a.appendChild(svg('circle', { 'class': 'k-' + it.kind, cx: X + 38 + j * 12, cy: y + 18, r: 3.5 }));
      });
      a.appendChild(svg('text', { 'class': 'm-count', x: X + 38 + g.items.length * 12 + 2, y: y + 22 },
        g.items.length === 1 ? '1 thing' : g.items.length + ' things'));
      s.appendChild(a);
    });

    box.textContent = '';
    box.appendChild(s);
  }

  // ---- The groups, in words --------------------------------------------------
  function list(groups) {
    var out = document.getElementById('groups');
    out.textContent = '';
    groups.forEach(function (g, i) {
      var h = el('h3', null, g.title);
      h.id = 'g' + i;
      out.appendChild(h);
      if (g.note) out.appendChild(el('p', 'group-note', g.note));
      var ul = el('ul', 'links');
      g.items.forEach(function (it) {
        var li = el('li', it.kind === 'private' ? 'quiet' : null);
        if (it.href) {
          var a = el('a', null, it.name);
          a.href = it.href;
          li.appendChild(a);
        } else {
          linked(it.name, li);
        }
        if (it.hint) li.appendChild(linked(cap(it.hint), el('span', 'hint')));
        (it.subs || []).forEach(function (sub) {
          li.appendChild(linked(cap(sub), el('span', 'hint')));
        });
        ul.appendChild(li);
      });
      out.appendChild(ul);
    });
  }

  // Redraw only when something has changed, and play the drawing once.
  var drawn = false, shown = '';
  function render(artifacts, lists) {
    var groups = gather(artifacts, lists);
    if (!groups.length) return false;
    var key = JSON.stringify(groups);
    if (key === shown) return true;
    shown = key;
    draw(groups);
    list(groups);
    if (!drawn) { drawn = true; playOnce(); }
    return true;
  }

  // The drawing draws itself once, when it first scrolls into view.
  function playOnce() {
    var box = document.getElementById('drawing');
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still || !('IntersectionObserver' in window)) return;
    box.classList.add('ready');
    var io = new IntersectionObserver(function (seen) {
      if (!seen[0].isIntersecting) return;
      io.disconnect();
      box.classList.add('play');
      // Once it has played, later redraws simply appear.
      setTimeout(function () { box.classList.remove('ready', 'play'); }, 4000);
    }, { threshold: 0.2 });
    io.observe(box);
  }

  // Show the saved copy at once, then the beach's own as it answers.
  render(SAVED.artifacts, SAVED.lists);

  Beach.live(function () {
    return Promise.all([
      Beach.get('artifacts:Phenomemental'),
      Beach.get('lists:Phenomemental').catch(function () { return SAVED.lists; })
    ]).then(function (r) {
      if (!render(r[0], r[1])) throw new Error('empty map');
    });
  }, document.getElementById('live-note'));
})();
</script>
