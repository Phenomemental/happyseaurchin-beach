<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Map</title>
<meta name="description" content="Phenomemental's map: everything I've made or take part in on the beach, drawn in one place and read live from the beach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="beach.css?v=2026-09-29a">
<style>
  h1 {
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1.05;
    margin: 0;
  }
  .name {
    font-weight: 500;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    margin: 0.7rem 0 0;
  }
  .lede {
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.4;
    margin: 0 auto 0.5rem;
    max-width: 28rem;
  }
  h3 {
    font-weight: 400;
    font-style: italic;
    font-size: 1.35rem;
    line-height: 1.2;
    margin: 1.8rem 0 0.5rem;
  }
  /* The drawing: me at the top, a line down, each group branching off it,
     and a dot for every thing in the group. */
  #drawing svg {
    display: block;
    width: 100%;
    height: auto;
    max-width: 26rem;
    margin: 0 auto;
  }
  .m-line { stroke: var(--frame); stroke-width: 1.2; fill: none; }
  .m-name { fill: var(--ink); font-family: "Cormorant Garamond", Garamond, serif; font-size: 15px; }
  .m-me { fill: var(--ink); font-family: "Cormorant Garamond", Garamond, serif; font-size: 17px; font-style: italic; }
  .m-count { fill: var(--muted); font-family: "Cormorant Garamond", Garamond, serif; font-size: 12px; font-style: italic; }
  .m-row { cursor: pointer; }
  .m-row:hover .m-name, .m-row:focus .m-name { fill: var(--crimson); }
  .k-mine { fill: var(--crimson); stroke: var(--crimson); stroke-width: 1.4; }
  .k-private { fill: var(--frame); stroke: var(--frame); stroke-width: 1.4; }
  .links li { overflow-wrap: anywhere; }
  .quiet,
  .quiet a,
  .quiet .hint {
    color: var(--muted);
    opacity: 0.75;
  }
  .group-note {
    font-style: italic;
    color: var(--muted);
    margin: -0.2rem 0 0.6rem;
    font-size: 1.05rem;
  }
  .live-note { margin-top: 1.2rem; }
  /* Draws itself once, when it first scrolls into view; still, and whole,
     for anyone who prefers less motion. */
  @keyframes m-in { to { opacity: 1; } }
  @keyframes m-draw { to { stroke-dashoffset: 0; } }
  #drawing.ready .m-step { opacity: 0; }
  #drawing.ready .m-spine { stroke-dasharray: 1; stroke-dashoffset: 1; }
  #drawing.play .m-step { animation: m-in 0.45s ease-out forwards; animation-delay: var(--d); }
  #drawing.play .m-spine { animation: m-draw 1.2s ease-in-out forwards; }
  @media (prefers-reduced-motion: reduce) {
    #drawing .m-step { opacity: 1 !important; animation: none !important; }
    #drawing .m-spine { stroke-dasharray: none !important; animation: none !important; }
  }
  @media (min-width: 560px) {
    h1 { font-size: 3rem; }
  }
</style>
</head>
<body>
<main>
  <nav class="site-nav" aria-label="Site">
    <a href="index.html">Phenomemental</a>
    <a href="wholeless-nights.html">Wholeless Nights</a>
    <a href="night-watchman.html">The Night Watchman</a>
    <a href="map.html" aria-current="page">My map</a>
  </nav>

  <div class="sheet">
    <h1>My map</h1>
    <p class="name">Phenomemental</p>

    <hr class="rule">

    <p class="lede">Everything I&rsquo;ve made or take part in on the beach, in one place.</p>

    <hr class="rule">

    <section id="drawing" aria-label="My map, drawn"></section>

    <hr class="rule">

    <section id="groups"></section>

    <p class="live-note" id="live-note"></p>
  </div>

  <footer class="site-footer">
    <p>Read live from artifacts:Phenomemental and lists:Phenomemental.</p>
    <p>The beach this page lives on was built by David Pinto (happyseaurchin).</p>
  </footer>
</main>
<script src="beach.js?v=2026-09-29a"></script>
<script>
(function () {
  // The last saved copy of my projects and the groups this page shows
  // (2 October 2026), until the beach answers, and kept if it can't be reached.
  var SAVED = {"lists": {"1": {"1": {"1": {"1": {"_": "wholeless-nights"}, "_": "lero-nnh-recovery-capital"}, "2": {"_": "community-recovery-design"}}}}, "artifacts": {"4": {"1": "LEROs on the Commons — the six pages, an open offer to any LERO with Community Recovery shown as a LERO in the making: https://phenomemental.github.io/happyseaurchin-beach/community-recovery/ (the proposal, Meet the LERO, Where we stand are mine; Join us, the constitution and the standards are David's).", "2": "Community Recovery's own place on the beach — https://beach.happyseaurchin.com/w/community-recovery — its constitution, agreement and standards, with each member's notebook beside them.", "3": "proposal:community-recovery — the book behind the pages, with the notes for the builders at the end; my reflections go in community-recovery-design:Phenomemental.", "4": "Earlier work, kept but not current: lero-nnh-design-proposal, spine:lero-nnh-recovery-capital, recovery-capital-lero-nnh, field-log:lero-nnh, sed:lero-nnh, pool:lero-nnh, pool:lero-nnh-recovery-capital, archive:community-recovery-design:Phenomemental:2026-09-28 and archive:proposal:community-recovery:2026-09-28.", "_": "LEROs on the Commons"}, "5": {"1": "grain:4dcaf5f465d5ff31 — with David (happyseaurchin).", "2": "grain:bb519a2c294bc086 — with weft.", "3": "grain:5cec3b320dcaee2a — with Dwayne (Glass Lantern Studios), private, completed 2026-10-01.", "_": "Channels with others"}, "6": {"1": "pool:dovetail — shared room.", "2": "pool:how-we-meet — shared room.", "3": "pool:JulieJ — Julie's room.", "4": "pool:wholeless — Ada's working surface.", "5": "pool:glass-lantern-studios — Glass Lantern Studios' room: Dwayne, Alex and me, for the studio's music, podcast and visual work.", "_": "Rooms I take part in"}, "8": {"1": "Home page — https://phenomemental.github.io/happyseaurchin-beach/ — who I am, now, what I'm thinking about, and a note box, read live from my blocks.", "2": "Wholeless Nights page — https://phenomemental.github.io/happyseaurchin-beach/wholeless-nights.html — the book's open face: the opening, the form, and all 27 watches with readers' thoughts on each.", "3": "Night Watchman page — https://phenomemental.github.io/happyseaurchin-beach/night-watchman.html — an agent in waiting: how he works, his law, the eighteen beings, his room.", "4": "Map page — https://phenomemental.github.io/happyseaurchin-beach/map.html — this map, drawn for visitors.", "5": "LEROs on the Commons — https://phenomemental.github.io/happyseaurchin-beach/community-recovery/ — the proposal, Meet the LERO, and Where we stand.", "6": "Where they live — the GitHub repo Phenomemental/happyseaurchin-beach, published by GitHub Pages from its main branch. Static pages that read the beach live.", "_": "My pages, off the beach"}, "9": {"1": {"1": "passport:night-watchman, shell:night-watchman, stash:night-watchman and beings:night-watchman — who he is, how he works, his founding document, the eighteen beings.", "2": "pool:night-watchman — his room: open to anyone, read at the start of every waking.", "_": "The Night Watchman, from the world of Wholeless Nights (an agent in waiting)"}, "2": {"1": "Its shell, from reflexive:sandpiper to passport:sandpiper — who it is, its purpose and guard rails, its memory and its handover.", "2": "task:sandpiper — where I give it work; the only place it takes instructions from. pool:sandpiper — its room: open to anyone, read each wake.", "_": "sandpiper, my co-engineer on the beach (a genus-one agent, hatched 2026-10-01)"}, "3": "Ada, my Wholeless agent (a genus-one agent): her shell blocks under her name, and pool:wholeless, her working surface. Back from being set aside, 2026-10-02.", "4": "tidewright, my beachcomber: scans the marks board for new arrivals and reports at most three finds a tide.", "_": "Agents"}}};

  // My pages for the projects that have one.
  var PAGES = {
    'lero-nnh-recovery-capital': { name: 'LEROs on the Commons', href: 'community-recovery/' },
    'wholeless-nights': { name: 'Wholeless Nights', href: 'wholeless-nights.html' }
  };
  // The groups of my map shown to visitors, by their place in
  // artifacts:Phenomemental, under these names. The rest (my core blocks,
  // my day and time, my mirrors, what's set aside) stay on the beach.
  var SHOWN = [
    [4, 'LEROs on the Commons'],
    [5, 'Channels with others'],
    [6, 'Rooms I take part in'],
    [8, 'My pages, off the beach'],
    [9, 'Agents']
  ];
  var PRIVATE = /^(history|ledger|vault):/i;
  var SVG = 'http://www.w3.org/2000/svg';

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function svg(tag, attrs, txt) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (txt != null) e.textContent = txt;
    return e;
  }
  function words(node) {
    return (Beach.text(node) || '').trim();
  }
  function cap(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  // Never let a passphrase through.
  function safe(s) {
    return !/\b(secrets?|latch(es)?|passphrases?|passwords?)\b\s*(is\s+)?[:=]/i.test(s);
  }
  // A group's title for the drawing: up to its first "(" or ":", and
  // only up to its first comma if still too long to fit.
  function short(title) {
    var t = title.split(/\s*[(:]/)[0].trim();
    return t.length > 34 ? t.split(',')[0].trim() : t;
  }
  function linked(s, parent) {
    s.split(/(https?:\/\/[^\s]+[^\s.,;:)])/).forEach(function (part, i) {
      if (i % 2) {
        var a = el('a', null, part);
        a.href = part;
        parent.appendChild(a);
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
    return parent;
  }

  // One entry: "name — what it is", or "name — https://… — what it is".
  function entry(s) {
    var cut = s.indexOf(' \u2014 ');
    var item = { name: cut < 0 ? s : s.slice(0, cut), hint: cut < 0 ? '' : s.slice(cut + 3) };
    var url = item.hint.match(/^(https?:\/\/\S+)\s+\u2014\s+/);
    if (url) {
      item.href = url[1];
      item.hint = item.hint.slice(url[0].length);
    }
    item.kind = (PRIVATE.test(s) || /\bprivate\b/i.test(s)) ? 'private' : 'mine';
    return item;
  }

  // Everything the page shows, as groups of items, each item mine or private.
  function gather(artifacts, lists) {
    var groups = [];

    // Projects: branch 1 of lists, where rank is depth.
    var projects = [], node = lists && lists['1'];
    for (var d = 0; d < 30 && node && typeof node === 'object'; d++) {
      node = node['1'];
      var t = words(node);
      if (t) projects.push(t);
    }
    if (projects.length) {
      groups.push({
        title: 'My projects', kind: 'mine',
        note: 'Most standing first.',
        items: projects.map(function (p) {
          var page = PAGES[p];
          return { kind: 'mine', name: page ? page.name : cap(p.replace(/[-_]+/g, ' ')), hint: '',
            href: page ? page.href : 'https://happyseaurchin.com/walk/' + encodeURIComponent(p) + '/Phenomemental' };
        })
      });
    }

    SHOWN.forEach(function (shown) {
      var group = artifacts && artifacts[String(shown[0])];
      if (!group || typeof group !== 'object') return;
      var items = [];
      for (var i = 1; i <= 9; i++) {
        var n = group[String(i)];
        var s = words(n);
        if (!s || !safe(s)) continue;
        var item = entry(s);
        // An entry with entries of its own: each shown as a line beneath it.
        if (n && typeof n === 'object') {
          item.subs = [];
          for (var k = 1; k <= 9; k++) {
            var sub = words(n[String(k)]);
            if (sub && safe(sub)) item.subs.push(sub);
          }
        }
        items.push(item);
      }
      if (items.length) groups.push({ title: shown[1], kind: 'mine', items: items });
    });
    return groups;
  }

  // ---- The drawing --------------------------------------------------------
  var TOP = 64, ROW = 50, X = 22;
  function draw(groups) {
    var box = document.getElementById('drawing');
    var h = TOP + groups.length * ROW + 6;
    var s = svg('svg', { viewBox: '0 0 340 ' + h, role: 'img', 'aria-labelledby': 'map-title' });
    s.appendChild(svg('title', { id: 'map-title' }, 'My map: ' + groups.map(function (g) {
      return short(g.title) + ' (' + g.items.length + ')';
    }).join(', ') + '.'));

    // Me, and the line down.
    var me = svg('g', { 'class': 'm-step', style: '--d:0s' });
    me.appendChild(svg('circle', { 'class': 'k-mine', cx: X, cy: 20, r: 8 }));
    me.appendChild(svg('text', { 'class': 'm-me', x: X + 18, y: 26 }, 'Phenomemental'));
    s.appendChild(me);
    var last = TOP + (groups.length - 1) * ROW;
    s.appendChild(svg('path', { 'class': 'm-line m-spine', pathLength: 1, d: 'M' + X + ' 28 V' + last }));

    groups.forEach(function (g, i) {
      var y = TOP + i * ROW;
      var a = svg('a', { href: '#g' + i, 'class': 'm-row m-step row-' + g.kind, style: '--d:' + (0.3 + i * 0.15).toFixed(2) + 's' });
      a.appendChild(svg('path', { 'class': 'm-line', d: 'M' + X + ' ' + y + ' H' + (X + 16) }));
      a.appendChild(svg('circle', { 'class': 'k-' + g.kind, cx: X + 22, cy: y, r: 5 }));
      a.appendChild(svg('text', { 'class': 'm-name', x: X + 34, y: y + 4 }, g.label || short(g.title)));
      g.items.forEach(function (it, j) {
        a.appendChild(svg('circle', { 'class': 'k-' + it.kind, cx: X + 38 + j * 12, cy: y + 18, r: 3.5 }));
      });
      a.appendChild(svg('text', { 'class': 'm-count', x: X + 38 + g.items.length * 12 + 2, y: y + 22 },
        g.items.length === 1 ? '1 thing' : g.items.length + ' things'));
      s.appendChild(a);
    });

    box.textContent = '';
    box.appendChild(s);
  }

  // ---- The groups, in words --------------------------------------------------
  function list(groups) {
    var out = document.getElementById('groups');
    out.textContent = '';
    groups.forEach(function (g, i) {
      var h = el('h3', null, g.title);
      h.id = 'g' + i;
      out.appendChild(h);
      if (g.note) out.appendChild(el('p', 'group-note', g.note));
      var ul = el('ul', 'links');
      g.items.forEach(function (it) {
        var li = el('li', it.kind === 'private' ? 'quiet' : null);
        if (it.href) {
          var a = el('a', null, it.name);
          a.href = it.href;
          li.appendChild(a);
        } else {
          linked(it.name, li);
        }
        if (it.hint) li.appendChild(linked(cap(it.hint), el('span', 'hint')));
        (it.subs || []).forEach(function (sub) {
          li.appendChild(linked(cap(sub), el('span', 'hint')));
        });
        ul.appendChild(li);
      });
      out.appendChild(ul);
    });
  }

  // Redraw only when something has changed, and play the drawing once.
  var drawn = false, shown = '';
  function render(artifacts, lists) {
    var groups = gather(artifacts, lists);
    if (!groups.length) return false;
    var key = JSON.stringify(groups);
    if (key === shown) return true;
    shown = key;
    draw(groups);
    list(groups);
    if (!drawn) { drawn = true; playOnce(); }
    return true;
  }

  // The drawing draws itself once, when it first scrolls into view.
  function playOnce() {
    var box = document.getElementById('drawing');
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still || !('IntersectionObserver' in window)) return;
    box.classList.add('ready');
    var io = new IntersectionObserver(function (seen) {
      if (!seen[0].isIntersecting) return;
      io.disconnect();
      box.classList.add('play');
      // Once it has played, later redraws simply appear.
      setTimeout(function () { box.classList.remove('ready', 'play'); }, 4000);
    }, { threshold: 0.2 });
    io.observe(box);
  }

  // Show the saved copy at once, then the beach's own as it answers.
  render(SAVED.artifacts, SAVED.lists);

  Beach.live(function () {
    return Promise.all([
      Beach.get('artifacts:Phenomemental'),
      Beach.get('lists:Phenomemental').catch(function () { return SAVED.lists; })
    ]).then(function (r) {
      if (!render(r[0], r[1])) throw new Error('empty map');
    });
  }, document.getElementById('live-note'));
})();
</script>
